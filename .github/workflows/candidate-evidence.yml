name: Candidate final evidence gate - no model calls
on:
  workflow_dispatch:
    inputs:
      retained_run:
        description: Completed selective continuation evidence run
        type: string
        required: true
        default: '38289599150'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - name: Download actual paid evidence without repeating calls
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_RUN: ${{ inputs.retained_run }}
        run: |
          gh run download "$RETAINED_RUN" --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-linux --dir evidence
          gh run download "$RETAINED_RUN" --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-windows --dir evidence
      - run: python scripts/regrade_candidate_evidence.py evidence
      - run: python scripts/verify_candidate_evidence.py evidence
      - run: python scripts/candidate_report.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-final-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 30
