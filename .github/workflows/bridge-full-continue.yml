name: Continue original full suite - retain 20 call budget
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original-bridge-full-suite
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: write
    outputs:
      ready: ${{ steps.real.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify controller and install fixed tooling
        run: |
          python -m pip install uv pyyaml
          python -m unittest discover -s tests -v
          npm install -g @openai/codex@0.162.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-full-linux
          run-id: 38267594773
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Remaining Linux coverage - retain prior 9 calls and 2 reviews
        id: real
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PRIOR_EVIDENCE: prior-evidence
          PYTHONUTF8: '1'
        run: python scripts/continue_full_suite.py --lane latest-linux
      - name: Sanitize Linux evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: original-full-linux
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  windows:
    needs: linux
    if: always() && needs.linux.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed tooling
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-full-windows
          run-id: 38267594773
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Windows main chain - retain failed first launch and max 6 total calls
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PRIOR_EVIDENCE: prior-evidence
          PYTHONUTF8: '1'
        run: python scripts/continue_full_suite.py --lane latest-windows
      - name: Sanitize Windows evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: original-full-windows
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  report:
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: original-full-*
          path: evidence
          merge-multiple: true
      - run: python scripts/full_report.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-full-report
          path: |
            evidence/full-report.zh-CN.md
            evidence/full-results.json
          retention-days: 7
