name: Verify original Windows archival - no model calls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-native-archive:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-full-windows
          run-id: 38271885332
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Recheck exact canonical requirements and actual original PowerShell archive
        env:
          PRIOR_EVIDENCE: prior-evidence
          PYTHONUTF8: '1'
        run: python scripts/verify_windows_archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-archive-verification
          path: evidence/
          include-hidden-files: true
          retention-days: 7
