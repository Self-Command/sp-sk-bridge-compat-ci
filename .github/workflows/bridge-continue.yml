name: Continue complete bridge suite - remaining entries
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-bridge-suite
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check verifier and install fixed tooling
        run: |
          python -m unittest discover -s tests -v
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: complete-bridge-evidence
          run-id: 38253965707
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Continue real product through remaining bridge entries
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PRIOR_EVIDENCE: prior-evidence
          PYTHONUTF8: '1'
        run: python scripts/continue_suite.py
      - name: Sanitize evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: continued-bridge-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 7
