name: Real Codex bridge compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-compatibility
  cancel-in-progress: false
jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  latest:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      ready: ${{ steps.real.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed Codex CLI and tooling
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pytest pyyaml
      - name: Real Codex scenarios
        id: real
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PYTHONUTF8: '1'
        run: python scripts/run_ci.py --lane latest-linux
      - name: Verify and sanitize evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: evidence-latest-linux
          path: evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  live:
    needs: latest
    if: needs.latest.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: latest-windows
            os: windows-2022
          - lane: baseline-linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed Codex CLI and tooling
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pytest pyyaml
      - name: Real Codex scenarios
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PYTHONUTF8: '1'
        run: python scripts/run_ci.py --lane ${{ matrix.lane }}
      - name: Verify and sanitize evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: evidence-${{ matrix.lane }}
          path: evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  report:
    if: always()
    needs: [harness, latest, live]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true
      - run: python scripts/report.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-report
          path: evidence/compatibility-report.md
          retention-days: 7
