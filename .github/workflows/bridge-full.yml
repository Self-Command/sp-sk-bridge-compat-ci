name: Original bridge full coverage - Codex Linux Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-bridge-full-suite
  cancel-in-progress: false
jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -v
  linux:
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      ready: ${{ steps.real.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed Codex and test tooling
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
      - name: Original full Linux scenarios - max 14 calls 4 reviews
        id: real
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python scripts/run_full_suite.py --lane latest-linux
      - name: Sanitize Linux evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: original-full-linux
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  windows:
    needs: [harness, linux]
    if: always() && needs.harness.result == 'success' && needs.linux.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed Codex and test tooling
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
      - name: Original full Windows workflow - max 6 calls 2 reviews
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PYTHONUTF8: '1'
        run: python scripts/run_full_suite.py --lane latest-windows
      - name: Sanitize Windows evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: original-full-windows
          path: evidence/
          include-hidden-files: true
          retention-days: 7
  report:
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: original-full-*
          path: evidence
          merge-multiple: true
      - run: python scripts/full_report.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-full-report
          path: |
            evidence/full-report.zh-CN.md
            evidence/full-results.json
          retention-days: 7
