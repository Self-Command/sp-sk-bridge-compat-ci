name: Continue v1.4 candidate - retain 20 calls and 6 reviewers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bridge-v140-regression
  cancel-in-progress: false
jobs:
  retained-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - name: Fetch immutable original paid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38283007683 --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-linux --dir prior
          gh run download 38283007683 --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-windows --dir prior
          python scripts/check_candidate_continuation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-budget
          path: continuation-budget.json
  linux:
    needs: retained-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    outputs:
      ready: ${{ steps.real.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fixed tools, same candidate, retained paid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
          gh run download 38282552013 --repo Self-Command/speckit-superpowers-bridge --name bridge-candidate-package --dir candidate
          gh run download 38283007683 --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-linux --dir prior
          python scripts/check_candidate.py candidate 048cf1e9b839ef34fcf1a36e0af2cabcc1d06e44
      - name: Five remaining Linux calls - counters start at 9 main and 2 reviewers
        id: real
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          BRIDGE_CANDIDATE_ZIP: candidate/speckit-superpowers-bridge-v1.4.0.zip
          BRIDGE_CANDIDATE_INDEX: candidate/candidate-index.json
          BRIDGE_CANDIDATE_SHA: 048cf1e9b839ef34fcf1a36e0af2cabcc1d06e44
        run: python scripts/continue_candidate_suite.py --lane latest-linux --prior prior/latest-linux
      - name: Sanitize evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: candidate-full-linux
          path: evidence/
          include-hidden-files: true
          retention-days: 14
  windows:
    needs: [retained-budget,linux]
    if: always() && needs.retained-budget.result == 'success' && needs.linux.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fixed tools, same candidate, retained paid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @openai/codex@0.162.1
          python -m pip install uv pyyaml
          gh run download 38282552013 --repo Self-Command/speckit-superpowers-bridge --name bridge-candidate-package --dir candidate
          gh run download 38283007683 --repo Self-Command/sp-sk-bridge-compat-ci --name candidate-full-windows --dir prior
          python scripts/check_candidate.py candidate 048cf1e9b839ef34fcf1a36e0af2cabcc1d06e44
      - name: Four remaining Windows calls - counters start at 2 main and 1 reviewer
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
          PYTHONUTF8: '1'
          BRIDGE_CANDIDATE_ZIP: candidate/speckit-superpowers-bridge-v1.4.0.zip
          BRIDGE_CANDIDATE_INDEX: candidate/candidate-index.json
          BRIDGE_CANDIDATE_SHA: 048cf1e9b839ef34fcf1a36e0af2cabcc1d06e44
        run: python scripts/continue_candidate_suite.py --lane latest-windows --prior prior/latest-windows
      - name: Sanitize evidence
        id: sanitized
        if: always()
        env:
          KRILL_API_KEY: ${{ secrets.KRILL_API_KEY }}
        run: python scripts/sanitize.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.sanitized.outcome == 'success'
        with:
          name: candidate-full-windows
          path: evidence/
          include-hidden-files: true
          retention-days: 14
  report:
    if: always()
    needs: [linux,windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-full-*
          path: evidence
          merge-multiple: true
      - run: python scripts/candidate_report.py evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-full-report
          path: |
            evidence/candidate-report.zh-CN.md
            evidence/candidate-results.json
